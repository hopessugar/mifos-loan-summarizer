services:
  # ============================================================================
  # Backend Service - FastAPI application
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mifos-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Application settings
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - API_KEY=${API_KEY}
      
      # LLM Provider Configuration
      - LLM_PRIMARY=${LLM_PRIMARY:-gemini}
      - LLM_MODEL=${LLM_MODEL:-gemini-3.1-flash-lite}
      - LLM_FALLBACK=${LLM_FALLBACK:-}
      - LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-}
      
      # LLM Provider API Keys
      - GROQ_API_KEY=${GROQ_API_KEY}
      - HF_API_KEY=${HF_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:latest}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      
      # Fineract Configuration
      - FINERACT_URL=${FINERACT_URL:-https://demo.mifos.community/fineract-provider}
      - FINERACT_USER=${FINERACT_USER:-mifos}
      - FINERACT_PASSWORD=${FINERACT_PASSWORD}
      - FINERACT_TENANT=${FINERACT_TENANT:-default}
      - FINERACT_SSL_VERIFY=${FINERACT_SSL_VERIFY:-true}
      - FINERACT_CA_BUNDLE=${FINERACT_CA_BUNDLE:-}
      
      # Pipeline Configuration
      - USE_SEMANTIC_CHUNKING=${USE_SEMANTIC_CHUNKING:-false}
      - MAX_SEGMENT_TOKENS=${MAX_SEGMENT_TOKENS:-200}
      - LEVENSHTEIN_THRESHOLD=${LEVENSHTEIN_THRESHOLD:-0.80}
      - COSINE_THRESHOLD=${COSINE_THRESHOLD:-0.80}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.50}
      - MATH_TOLERANCE=${MATH_TOLERANCE:-0.10}
      - MAX_INPUT_CHARS=${MAX_INPUT_CHARS:-50000}
      - EXTRACTION_MAX_TOKENS=${EXTRACTION_MAX_TOKENS:-16384}
      - SUMMARY_MAX_TOKENS=${SUMMARY_MAX_TOKENS:-2048}
      - EXTRACTION_TEMPERATURE=${EXTRACTION_TEMPERATURE:-0}
      
      # Encoding — prevent emoji/unicode errors on Windows hosts
      - PYTHONIOENCODING=utf-8
    networks:
      - mifos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================================================
  # Frontend Service - React + Nginx
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
        - VITE_API_KEY=${API_KEY}
    container_name: mifos-frontend
    ports:
      - "80:8080"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    networks:
      - mifos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
  # ============================================================================
  # Ollama Service (OPTIONAL) — Local LLM inference
  # ============================================================================
  # To use Ollama as your LLM provider:
  #   1. Uncomment this service block
  #   2. Set LLM_PRIMARY=ollama in your .env file
  #   3. Set OLLAMA_MODEL to your preferred model (e.g. llama3.2:latest)
  #   4. Run: docker compose up -d
  #   The model will be auto-pulled on first start.
  #
  # GPU Support:
  #   - NVIDIA: Uncomment the 'deploy' section below
  #   - AMD: Replace 'nvidia' with 'amd' in the deploy section
  #   - CPU-only: Remove the deploy section entirely (slower but works)
  # ============================================================================
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: mifos-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama    # Persist downloaded models across restarts
  #   environment:
  #     - OLLAMA_HOST=0.0.0.0          # Allow connections from other containers
  #   networks:
  #     - mifos-network
  #   restart: unless-stopped
  #   # Uncomment for NVIDIA GPU support:
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - driver: nvidia
  #   #           count: all
  #   #           capabilities: [gpu]
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 30s

# ============================================================================
# Networks
# ============================================================================
networks:
  mifos-network:
    driver: bridge
    name: mifos-network

# ============================================================================
# Volumes
# ============================================================================
# volumes:
#   ollama-data:    # Uncomment when using the Ollama service above
